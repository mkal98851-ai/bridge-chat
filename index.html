<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Bridge Chat</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg: #0a0f14;
    --panel: #111a22;
    --line: #1e2b38;
    --signal: #ff7a3d;
    --ok: #3ddc84;
    --danger: #ff5a5a;
    --bubble-me: #ff7a3d;
    --bubble-me-text: #1a0f0a;
    --bubble-them: #182430;
    --text: #e6edf3;
    --text-dim: #7d8ea3;
    --mono: 'SFMono-Regular', Consolas, 'Roboto Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  #entry{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding: 24px; padding-top:56px; text-align:center; overflow-y:auto;
  }
  .mark{
    display:inline-flex; align-items:center; gap:8px;
    font-family: var(--mono); font-size:11px; letter-spacing:0.14em;
    color: var(--text-dim); text-transform:uppercase; margin-bottom:8px;
  }
  .mark .dot{
    width:6px; height:6px; border-radius:50%; background:var(--signal);
    box-shadow: 0 0 8px var(--signal); animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:0.25} }
  #entry h1{ font-size:28px; font-weight:700; letter-spacing:-0.02em; margin-bottom:6px; }
  #entry .sub{ color:var(--text-dim); font-size:14px; margin-bottom:32px; }

  .entry-card{
    background: var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:24px; width:100%; max-width:340px; margin-bottom:14px; margin-top:24px;
  }
  .entry-card h2{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin-bottom:14px; font-weight:600; }

  .digit-code{
    font-family: var(--mono); font-size:44px; font-weight:700; letter-spacing:0.15em;
    color: var(--signal); margin: 8px 0 4px;
  }
  .digit-code.pending{ font-size:15px; color:var(--text-dim); letter-spacing:normal; }

  .join-row{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  input[type=tel]{
    width:120px; background:#0a0f14; border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-family:var(--mono); font-size:22px;
    letter-spacing:0.3em; text-align:center;
  }
  input[type=tel]:focus{ outline:none; border-color:var(--signal); }

  .btn{
    background: var(--signal); color:#1a0f0a; border:none; border-radius:10px;
    padding:13px 18px; font-weight:700; font-size:14px; cursor:pointer;
    font-family:inherit; transition: transform .1s, opacity .15s;
  }
  .btn:hover{ opacity:0.92; }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn.block{ width:100%; margin-top:0; }

  .status-line{
    display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px;
    font-size:12px; color:var(--text-dim);
  }
  .status-line .led{ width:7px; height:7px; border-radius:50%; background:#3a4a5c; flex-shrink:0; }
  .status-line.live{ color: var(--ok); }
  .status-line.live .led{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .status-line.hidden{ display:none; }

  .or-div{ color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.1em; margin: 6px 0; }

  .room-grid{
    display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; width:100%;
  }
  .room-box{
    aspect-ratio: 1 / 1; border-radius:14px; background: var(--signal);
    border:none; color:#000; font-weight:800; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-family:inherit; transition: transform .1s, opacity .15s;
  }
  .room-box:hover{ opacity:0.92; }
  .room-box:active{ transform: scale(0.94); }

  #chatScreen{ display:none; flex-direction:column; height:100%; }
  #chatHeader{
    background: var(--panel); border-bottom:1px solid var(--line);
    padding: 14px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  #exitBtn{
    width:36px; height:36px; border-radius:50%; background:var(--bubble-them); border:none;
    color:var(--text-dim); font-size:18px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #exitBtn:hover{ color: var(--signal); }
  #chatHeader .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--signal);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#1a0f0a;
    flex-shrink:0;
  }
  #chatHeader .info{ flex:1; min-width:0; }
  #chatHeader .info .title{ font-weight:600; font-size:15px; }
  #chatHeader .info .subtitle{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  #chatHeader .info .subtitle .led{ width:6px; height:6px; border-radius:50%; background:#3a4a5c; }
  #chatHeader .info .subtitle.live .led{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  #chatHeader .info .subtitle.live{ color:var(--ok); }
  #clearBtn{
    width:36px; height:36px; border-radius:50%; background:var(--bubble-them); border:none;
    color:var(--text-dim); font-size:15px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #clearBtn:hover{ color: var(--danger); }

  #messages{
    flex:1; overflow-y:auto; padding: 16px 12px;
    display:flex; flex-direction:column; gap:8px;
    background-image: radial-gradient(circle at 25px 25px, #ffffff05 2%, transparent 0%), radial-gradient(circle at 75px 75px, #ffffff05 2%, transparent 0%);
    background-size: 100px 100px;
  }
  .msg-row{ display:flex; }
  .msg-row.me{ justify-content:flex-end; }
  .msg-row.them{ justify-content:flex-start; }
  .msg-row.sys{ justify-content:center; }

  .sys-note{
    font-size:11px; color:var(--text-dim); background:var(--panel);
    padding:5px 12px; border-radius:20px; border:1px solid var(--line);
  }

  .bubble{
    max-width: 76%; padding:9px 12px; border-radius:14px; font-size:14.5px; line-height:1.4;
    position:relative; word-wrap:break-word;
  }
  .msg-row.me .bubble{
    background: var(--bubble-me); color: var(--bubble-me-text);
    border-bottom-right-radius:4px;
  }
  .msg-row.them .bubble{
    background: var(--bubble-them); color:var(--text);
    border-bottom-left-radius:4px;
  }
  .bubble .time{
    font-size:10px; opacity:0.6; margin-top:3px; text-align:right;
  }

  .bubble img{ max-width:100%; border-radius:10px; display:block; margin-bottom:4px; }
  .file-card{
    display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px;
    background:rgba(0,0,0,0.15); margin-bottom:4px; min-width:180px;
  }
  .msg-row.them .file-card{ background: rgba(255,255,255,0.05); }
  .file-card .fc-icon{ font-size:22px; flex-shrink:0; }
  .file-card .fc-info{ flex:1; min-width:0; }
  .file-card .fc-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-card.is-image .fc-name{ font-size:10.5px; font-weight:500; opacity:0.75; }
  .file-card .fc-size{ font-size:11px; opacity:0.7; }
  .file-card .fc-progress{ height:2px; background:rgba(0,0,0,0.2); border-radius:2px; margin-top:5px; overflow:hidden; }
  .file-card .fc-progress-fill{ height:100%; background:currentColor; width:0%; transition:width .2s; }
  .file-card .fc-dl{
    background:none; border:1px solid currentColor; border-radius:6px;
    padding:4px 8px; font-size:11px; cursor:pointer; font-family:inherit; color:inherit; flex-shrink:0;
  }

  #composer{
    background: var(--panel); border-top:1px solid var(--line);
    padding: 10px 12px; display:flex; align-items:flex-end; gap:8px; flex-shrink:0;
  }
  #attachBtn{
    width:40px; height:40px; border-radius:50%; background:var(--bubble-them); border:none;
    color:var(--text-dim); font-size:20px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #textInput{
    flex:1; background:var(--bubble-them); border:none; color:var(--text);
    border-radius:20px; padding:11px 16px; font-size:14.5px; font-family:inherit;
    resize:none; max-height:100px; line-height:1.3;
  }
  #textInput:focus{ outline:none; }
  #sendBtn{
    width:40px; height:40px; border-radius:50%; background:var(--signal); border:none;
    color:#1a0f0a; font-size:18px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:disabled{ opacity:0.4; }
  #fileInput{ display:none; }

  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .bubble{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }

  #ctxBackdrop{
    position:fixed; inset:0; z-index:200; display:none; background:rgba(0,0,0,0.15);
  }
  #ctxMenu{
    position:fixed; z-index:201; display:none; min-width:150px;
    background: var(--panel); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  #ctxMenu button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:var(--text); font-family:inherit;
    font-size:14px; padding:11px 14px; cursor:pointer;
  }
  #ctxMenu button:not(:last-child){ border-bottom:1px solid var(--line); }
  #ctxMenu button:active{ background: var(--bubble-them); }
  #ctxMenu button.danger{ color: var(--danger); }

  .fc-progress-row{ display:flex; align-items:center; gap:6px; margin-top:5px; }
  .fc-progress{ flex:1; margin-top:0; }
  .fc-pct{ font-size:10px; opacity:0.75; flex-shrink:0; min-width:28px; text-align:right; }

  .reply-quote{
    display:flex; flex-direction:column; gap:1px; padding:6px 8px; margin-bottom:5px;
    border-left:3px solid currentColor; border-radius:6px; background:rgba(0,0,0,0.12);
    opacity:0.9; cursor:pointer;
  }
  .msg-row.them .reply-quote{ background:rgba(255,255,255,0.06); }
  .reply-quote .rq-label{ font-size:11px; font-weight:700; }
  .reply-quote .rq-text{ font-size:12px; opacity:0.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .edited-tag{ font-size:10px; opacity:0.6; font-style:italic; margin-left:4px; }

  #composerBar{ flex-shrink:0; }
  #actionBar{
    display:none; align-items:center; gap:8px; background:var(--panel);
    border-top:1px solid var(--line); padding:8px 12px; font-size:12.5px;
  }
  #actionBar .ab-accent{ width:3px; align-self:stretch; border-radius:2px; background:var(--signal); flex-shrink:0; }
  #actionBar .ab-body{ flex:1; min-width:0; }
  #actionBar .ab-title{ font-weight:700; color:var(--signal); font-size:11.5px; }
  #actionBar .ab-text{ color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #actionBar .ab-close{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; flex-shrink:0; }

  .toast{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:8px 16px; border-radius:20px; font-size:12.5px; z-index:250;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  /* Chhoti image preview - bubble ke andar bada dikhne se rokne ke liye */
  .bubble img{
    max-width:220px; max-height:220px; width:auto; height:auto;
    object-fit:cover; border-radius:10px; display:block; margin-bottom:4px; cursor:pointer;
  }

  /* Drag & Drop overlay */
  #dropOverlay{
    position:fixed; inset:0; z-index:300; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:rgba(10,15,20,0.9); border:3px dashed var(--signal);
    color:var(--text); text-align:center; padding:24px; pointer-events:none;
  }
  #dropOverlay.show{ display:flex; }
  #dropOverlay .dz-icon{ font-size:42px; }
  #dropOverlay .dz-title{ font-size:16px; font-weight:700; }
  #dropOverlay .dz-sub{ font-size:12.5px; color:var(--text-dim); }

  /* Fullscreen image preview viewer */
  #imgViewer{
    position:fixed; inset:0; z-index:400; display:none;
    align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.92);
  }
  #imgViewer.show{ display:flex; }
  #imgViewer img{
    max-width:94vw; max-height:88vh; object-fit:contain; border-radius:8px;
  }
  #imgViewer .iv-close{
    position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.08); border:none; color:#fff; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:2;
  }
  #imgViewer .iv-header{
    position:absolute; top:0; left:0; right:0; padding:16px 60px 20px 18px;
    background:linear-gradient(rgba(0,0,0,0.65), transparent); text-align:left; z-index:1;
  }
  #imgViewer .iv-name{ font-size:14px; font-weight:600; color:#fff; word-break:break-all; }
  #imgViewer .iv-size{ font-size:12px; color:rgba(255,255,255,0.7); margin-top:2px; }
  #imgViewer .iv-navrow{
    display:flex; align-items:center; justify-content:center; gap:36px; margin-top:16px;
  }
  #imgViewer .iv-navrow.hidden{ display:none; }
  #imgViewer .iv-nav{
    width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.1); border:none;
    color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #imgViewer .iv-nav:active{ background:rgba(255,255,255,0.22); }
  #imgViewer .iv-counter{ font-size:12.5px; color:rgba(255,255,255,0.75); min-width:44px; text-align:center; }

  /* Image grid (single / multiple grouped images) */
  .img-group{ display:grid; gap:3px; width:220px; border-radius:12px; overflow:hidden; margin-bottom:2px; }
  .img-group.n1{ display:block; width:auto; }
  .img-group.n2{ grid-template-columns:repeat(2,1fr); }
  .img-group.n3{ grid-template-columns:repeat(2,1fr); }
  .img-group.n3 .img-tile:nth-child(3){ grid-column:1/3; }
  .img-group.n4plus{ grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); }
  .img-tile{ position:relative; aspect-ratio:1/1; overflow:hidden; cursor:pointer; }
  .img-group.n1 .img-tile{ aspect-ratio:auto; }
  .img-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .img-group.n1 .img-tile img{ width:auto; height:auto; max-width:220px; max-height:220px; object-fit:cover; }
  .img-tile .more-overlay{
    position:absolute; inset:0; background:rgba(0,0,0,0.55); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700;
  }
  .img-status{ font-size:10.5px; color:var(--text-dim); margin:2px 2px 0; }
  .img-status.img-status-sending{ color:#000; font-weight:700; }
  .img-dl-row{ display:flex; justify-content:flex-end; margin-top:4px; }
  .img-dl-btn{
    width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.35); border:none;
    color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .img-dl-btn[disabled]{ opacity:0.35; cursor:not-allowed; }
</style>
</head>
<body>

<!-- ENTRY -->
<div id="entry">
  <div class="mark"><span class="dot"></span> firebase relay</div>
  <h1>Bridge Chat</h1>

  <div class="entry-card">
    <div class="room-grid" id="roomGrid">
      <button class="room-box" data-room="1">1</button>
      <button class="room-box" data-room="2">2</button>
      <button class="room-box" data-room="3">3</button>
      <button class="room-box" data-room="4">4</button>
      <button class="room-box" data-room="5">5</button>
      <button class="room-box" data-room="6">6</button>
      <button class="room-box" data-room="7">7</button>
      <button class="room-box" data-room="8">8</button>
      <button class="room-box" data-room="9">9</button>
      <button class="room-box" data-room="10">10</button>
    </div>
  </div>

  <div class="entry-card">
    <div class="join-row">
      <input type="tel" id="joinInput" placeholder="1-10" maxlength="2" inputmode="numeric">
      <button class="btn block" id="joinBtn">Join</button>
    </div>
    <div class="status-line" id="joinStatus"></div>
  </div>
</div>

<!-- CHAT -->
<div id="chatScreen">
  <div id="chatHeader">
    <button id="exitBtn" title="Room se exit karein">←</button>
    <div class="avatar" id="peerAvatar">?</div>
    <div class="info">
      <div class="title" id="peerTitle">Room —</div>
      <div class="subtitle" id="chatSubtitle"><span class="led"></span><span>Connecting…</span></div>
    </div>
    <button id="clearBtn" title="Sabhi chat clear karein">🗑️</button>
  </div>
  <div id="messages"></div>
  <div id="composerBar">
    <div id="actionBar">
      <div class="ab-accent"></div>
      <div class="ab-body">
        <div class="ab-title" id="actionBarTitle">Reply</div>
        <div class="ab-text" id="actionBarText"></div>
      </div>
      <button class="ab-close" id="actionBarClose">✕</button>
    </div>
    <div id="composer">
      <button id="attachBtn">📎</button>
      <input type="file" id="fileInput" multiple>
      <textarea id="textInput" placeholder="Message likhein…" rows="1"></textarea>
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<div id="ctxBackdrop"></div>
<div id="ctxMenu"></div>
<div class="toast" id="toast"></div>
<div id="dropOverlay">
  <div class="dz-icon">📥</div>
  <div class="dz-title">Yahan drop karein</div>
  <div class="dz-sub">File / Image bhejne ke liye chhod dein</div>
</div>
<div id="imgViewer">
  <div class="iv-header">
    <div class="iv-name" id="imgViewerName"></div>
    <div class="iv-size" id="imgViewerSize"></div>
  </div>
  <button class="iv-close" id="imgViewerClose">✕</button>
  <img id="imgViewerImg" src="" alt="preview">
  <div class="iv-navrow" id="imgViewerNavRow">
    <button class="iv-nav iv-prev" id="imgViewerPrev">←</button>
    <div class="iv-counter" id="imgViewerCounter"></div>
    <button class="iv-nav iv-next" id="imgViewerNext">→</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD7rqslmmw_ZCo97m8xDolZatmnaKjzhQQ",
  authDomain: "live-chat-650db.firebaseapp.com",
  databaseURL: "https://live-chat-650db-default-rtdb.firebaseio.com",
  projectId: "live-chat-650db",
  storageBucket: "live-chat-650db.firebasestorage.app",
  messagingSenderId: "686160183849",
  appId: "1:686160183849:web:3d58066569149a064cd238"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MAX_FILE_MB = 30;
const CHUNK_RAW_SIZE = 4 * 1024 * 1024;
let roomCode = '';
let myId = 'u' + Date.now() + Math.random().toString(36).slice(2,8);
let messagesRef = null;
let participantsRef = null;
let myParticipantRef = null;
let seenMessageIds = new Set();
const messageMeta = {};
let replyingTo = null;
let editingId = null;

function dlog(msg){
  const el = document.getElementById('debugLog');
  if(!el) return;
  const t = new Date().toLocaleTimeString('en-IN', { hour12:false });
  el.textContent += '[' + t + '] ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}
window.onerror = function(msg, src, line){
  dlog('JS ERROR: ' + msg + ' (line ' + line + ')');
};
dlog('Page loaded. Firebase check: ' + (typeof firebase !== 'undefined' ? 'loaded OK' : 'NOT LOADED'));

function fmtSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}
function nowTime(){
  const d = new Date();
  return d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function genDigitCode(){
  return String(Math.floor(Math.random()*100)).padStart(2,'0');
}
function abToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const len = bytes.byteLength;
  const CH = 0x8000;
  for(let i=0;i<len;i+=CH){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(binary);
}
function base64ToBytes(b64){
  const byteChars = atob(b64);
  const bytes = new Uint8Array(byteChars.length);
  for(let j=0;j<byteChars.length;j++) bytes[j] = byteChars.charCodeAt(j);
  return bytes;
}

/* ---------- context menu (long press: copy / reply / edit / delete) ---------- */
const ctxMenuEl = document.getElementById('ctxMenu');
const ctxBackdropEl = document.getElementById('ctxBackdrop');

function closeCtxMenu(){
  ctxMenuEl.style.display = 'none';
  ctxBackdropEl.style.display = 'none';
  ctxMenuEl.innerHTML = '';
}
ctxBackdropEl.addEventListener('click', closeCtxMenu);

function openCtxMenu(x, y, id){
  const meta = messageMeta[id];
  if(!meta) return;
  const items = [];
  if(meta.type === 'text'){
    items.push({ label: '📋 Copy', run: () => copyMessageText(id) });
  }
  items.push({ label: '↩️ Reply', run: () => startReply(id) });
  if(meta.mine && meta.type === 'text'){
    items.push({ label: '✏️ Edit', run: () => startEdit(id) });
  }
  items.push({ label: '🗑️ Delete', run: () => deleteMessage(id), danger: true });

  ctxMenuEl.innerHTML = items.map((it, i) =>
    '<button data-i="' + i + '"' + (it.danger ? ' class="danger"' : '') + '>' + it.label + '</button>'
  ).join('');
  ctxMenuEl.querySelectorAll('button').forEach((btn, i) => {
    btn.onclick = () => { closeCtxMenu(); items[i].run(); };
  });

  ctxBackdropEl.style.display = 'block';
  ctxMenuEl.style.display = 'block';
  const vw = window.innerWidth, vh = window.innerHeight;
  const rect = ctxMenuEl.getBoundingClientRect();
  let left = Math.min(x, vw - rect.width - 10);
  let top = Math.min(y, vh - rect.height - 10);
  left = Math.max(10, left);
  top = Math.max(10, top);
  ctxMenuEl.style.left = left + 'px';
  ctxMenuEl.style.top = top + 'px';
}

function attachLongPress(el, id){
  if(!el) return;
  let timer = null, startX = 0, startY = 0, longPressed = false;
  const clear = () => { if(timer) clearTimeout(timer); timer = null; };
  const begin = (x, y) => {
    longPressed = false;
    startX = x; startY = y;
    timer = setTimeout(() => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(15);
      openCtxMenu(x, y, id);
    }, 480);
  };
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    begin(t.clientX, t.clientY);
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if(Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clear();
  }, { passive: true });
  el.addEventListener('touchend', clear);
  el.addEventListener('mousedown', (e) => begin(e.clientX, e.clientY));
  el.addEventListener('mouseup', clear);
  el.addEventListener('mouseleave', clear);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.width = '1px';
    ta.style.height = '1px';
    ta.style.padding = '0';
    ta.style.border = 'none';
    ta.style.outline = 'none';
    ta.style.boxShadow = 'none';
    ta.style.background = 'transparent';
    ta.style.fontSize = '16px'; /* stops iOS auto-zoom */
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length); /* required on iOS Safari */
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(err){
    dlog('legacy copy failed: ' + err.message);
    return false;
  }
}

async function copyMessageText(id){
  const meta = messageMeta[id];
  if(!meta || !meta.text) return;
  let ok = false;
  if(window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(meta.text);
      ok = true;
    } catch(err){
      dlog('clipboard.writeText failed, falling back: ' + err.message);
    }
  }
  if(!ok) ok = legacyCopy(meta.text);
  showToast(ok ? 'Copy ho gaya' : 'Copy nahi ho paya, manually select karein');
}

function startReply(id){

    : meta.type === 'imagegroup' ? ('🖼️ ' + (meta.count > 1 ? (meta.count + ' photos') : meta.name))

function startEdit(id){

function deleteMessage(id){
  const meta = messageMeta[id];
  if(!meta || !messagesRef) return;
  if(!confirm('Ye message delete karein?')) return;
  messagesRef.child(id).remove().catch(err => dlog('ERROR deleting message: ' + err.message));
  if(meta.type === 'file' && meta.groupId){
    db.ref('rooms/' + roomCode + '/fileChunks/' + meta.groupId).remove()
      .catch(err => dlog('ERROR deleting file chunks: ' + err.message));
  } else if(meta.type === 'imagegroup' && meta.groupIds){
    meta.groupIds.forEach(gid => {
      db.ref('rooms/' + roomCode + '/fileChunks/' + gid).remove()
        .catch(err => dlog('ERROR deleting image chunks: ' + err.message));
    });

  if(replyingTo && replyingTo.id === id) cancelActionBar();

function joinByNumber(n){
  n = parseInt(n, 10);
  if(!n || n < 1 || n > 10) return;
  const code = String(n).padStart(2,'0');

function joinRoomInternal(code){
  messagesRef = db.ref('rooms/' + code + '/messages');
  participantsRef = db.ref('rooms/' + code + '/participants');
  myParticipantRef = participantsRef.child(myId);

  myParticipantRef.set(true)
    .then(() => {
      dlog('Room ' + code + ': registered as participant ' + myId);
      myParticipantRef.onDisconnect().remove();
      enterChat();
      setupListeners();
    })
    .catch((err) => {
      dlog('ERROR joining room: ' + err.message);
      document.getElementById('joinStatus').innerHTML = '<span class="led"></span><span>Connect nahi hua</span>';
      document.getElementById('joinBtn').disabled = false;
      document.querySelectorAll('.room-box').forEach(b => b.disabled = false);
    });

  document.getElementById('peerAvatar').textContent = roomCode;
  document.getElementById('peerTitle').textContent = 'Room ' + roomCode;
}

function leaveRoom(){
  if(myParticipantRef){
    myParticipantRef.remove().catch(err => dlog('ERROR leaving room: ' + err.message));
  }
  if(messagesRef) messagesRef.off();
  if(participantsRef) participantsRef.off();
  messagesRef = null;
  participantsRef = null;
  myParticipantRef = null;
  roomCode = '';
  seenMessageIds.clear();
  Object.keys(messageMeta).forEach(k => delete messageMeta[k]);
  messagesEl.innerHTML = '';
  cancelActionBar();

  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('entry').style.display = 'flex';
  document.getElementById('joinInput').value = '';
  document.getElementById('joinBtn').disabled = false;
  document.querySelectorAll('.room-box').forEach(b => b.disabled = false);

  dlog('Left room, back at entry screen');
}
document.getElementById('exitBtn').onclick = leaveRoom;

function setupListeners(){
  const sub = document.getElementById('chatSubtitle');

  participantsRef.on('value', (snap) => {
    const count = snap.exists() ? Object.keys(snap.val()).length : 0;
    dlog('Presence update: ' + count + ' participant(s) in room');
    if(count >= 2){
      sub.classList.add('live');
      sub.innerHTML = '<span class="led"></span><span>Online</span>';
    } else {
      sub.classList.remove('live');
      sub.innerHTML = '<span class="led"></span><span>Doosre device ka intezaar...</span>';
    }
  });

  messagesRef.on('child_added', (snap) => {
    const key = snap.key;
    if(seenMessageIds.has(key)) return;
    seenMessageIds.add(key);
    const msg = snap.val();
    if(msg.type === 'text'){
      addTextBubble(key, msg.text, false, msg.time, msg.replyTo, msg.edited, msg.sender);
    } else if(msg.type === 'file'){
      addFileBubble(key, msg);
    } else if(msg.type === 'imagegroup'){
      addImageGroupBubble(key, msg);
    } else if(msg.type === 'sys'){
      addSysMessage(msg.text, key);
    }
  });

  messagesRef.on('child_changed', (snap) => {
    const key = snap.key;
    const msg = snap.val();
    if(msg.type !== 'text') return;
    const meta = messageMeta[key];
    if(meta) meta.text = msg.text;
    const row = document.getElementById('msgrow-' + key);
    if(!row) return;
    const bubble = row.querySelector('.bubble');
    if(!bubble) return;
    const timeEl = bubble.querySelector('.time');
    const replyHtml = renderReplyQuoteHtml(msg.replyTo);
    bubble.innerHTML = replyHtml + escapeHtml(msg.text) +
      (msg.edited ? '<span class="edited-tag">(edited)</span>' : '') +
      (timeEl ? timeEl.outerHTML : '<div class="time">' + (msg.time || nowTime()) + '</div>');
  });

  messagesRef.on('child_removed', (snap) => {
    seenMessageIds.delete(snap.key);
    delete messageMeta[snap.key];
    const row = document.getElementById('msgrow-' + snap.key);
    if(row) row.remove();
    if(replyingTo && replyingTo.id === snap.key) cancelActionBar();
    if(editingId === snap.key) cancelActionBar();
  });

  addSysMessage('Room mein daakhil ho gaye');
}

  if(editingId){
    const id = editingId;
    messagesRef.child(id).update({ text: val, edited: true })
      .catch(err => dlog('ERROR editing message: ' + err.message));
    cancelActionBar();
    return;

  const msgRef = messagesRef.push();
  const msgId = msgRef.key;
  seenMessageIds.add(msgId);

  const replyPayload = replyingTo ? { id: replyingTo.id, sender: replyingTo.sender, preview: replyingTo.preview } : null;
  addTextBubble(msgId, val, true, time, replyPayload);

const imgViewer = document.getElementById('imgViewer');

const imgViewerNavRow = document.getElementById('imgViewerNavRow');
const imgViewerPrev = document.getElementById('imgViewerPrev');
const imgViewerNext = document.getElementById('imgViewerNext');
const imgViewerCounter = document.getElementById('imgViewerCounter');
let previewEntries = [];
let previewIndex = 0;

function renderPreviewFrame(){
  const e = previewEntries[previewIndex];
  if(!e) return;
  imgViewerImg.src = e.url;
  document.getElementById('imgViewerName').textContent = e.name || '';
  document.getElementById('imgViewerSize').textContent = (e.size != null) ? fmtSize(e.size) : '';
  if(previewEntries.length > 1){
    imgViewerNavRow.classList.remove('hidden');
    imgViewerCounter.textContent = (previewIndex + 1) + ' / ' + previewEntries.length;
  } else {
    imgViewerNavRow.classList.add('hidden');
  }
}
function openImagePreview(entries, idx){
  previewEntries = Array.isArray(entries) ? entries : [entries];
  previewIndex = idx || 0;
  renderPreviewFrame();
  imgViewer.classList.add('show');
}
function closeImagePreview(){
  imgViewer.classList.remove('show');
  imgViewerImg.src = '';
  previewEntries = [];
  previewIndex = 0;
}
function showPrevPreview(){
  if(!previewEntries.length) return;
  previewIndex = (previewIndex - 1 + previewEntries.length) % previewEntries.length;
  renderPreviewFrame();
}
function showNextPreview(){
  if(!previewEntries.length) return;
  previewIndex = (previewIndex + 1) % previewEntries.length;
  renderPreviewFrame();
}
imgViewerClose.onclick = closeImagePreview;
imgViewerPrev.onclick = showPrevPreview;
imgViewerNext.onclick = showNextPreview;
imgViewer.addEventListener('click', (e) => {

function handleIncomingFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const images = files.filter(f => f.type && f.type.startsWith('image/'));
  const others = files.filter(f => !(f.type && f.type.startsWith('image/')));
  if(images.length) sendImageGroup(images);
  others.forEach(f => sendFile(f));
}

/* ---------- Drag & Drop support ---------- */
const dropOverlay = document.getElementById('dropOverlay');
let dragCounter = 0;

function isChatActive(){
  const cs = document.getElementById('chatScreen');
  return cs.style.display === 'flex';
}

window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  if(!isChatActive()) return;
  dragCounter++;
  dropOverlay.classList.add('show');
});
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  if(!isChatActive()) return;
  if(e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  if(!isChatActive()) return;
  dragCounter--;
  if(dragCounter <= 0){
    dragCounter = 0;
    dropOverlay.classList.remove('show');
  }
});
window.addEventListener('drop', (e) => {
  e.preventDefault();
  if(!isChatActive()) return;
  dragCounter = 0;
  dropOverlay.classList.remove('show');
  if(!e.dataTransfer) return;
  const files = Array.from(e.dataTransfer.files || []);
  if(!files.length) return;
  handleIncomingFiles(files);
});

/* ---------- Grouped image messages (grid + single download) ---------- */
function buildImageGridMarkup(id, entries, sending){
  const total = entries.length;
  const visibleCount = Math.min(total, 4);
  let cls = 'img-group';
  if(total === 1) cls += ' n1';
  else if(total === 2) cls += ' n2';
  else if(total === 3) cls += ' n3';
  else cls += ' n4plus';

  let tiles = '';
  for(let i=0;i<visibleCount;i++){
    const e = entries[i];
    const isLastDimmed = (total > 4 && i === visibleCount - 1);
    tiles += '<div class="img-tile" data-idx="' + i + '">' +
      '<img src="' + e.url + '" draggable="false">' +
      (isLastDimmed ? '<div class="more-overlay">+' + (total - visibleCount) + '</div>' : '') +
    '</div>';
  }
  const statusHtml = sending ? '<div class="img-status img-status-sending" id="imgstatus-' + id + '">Sending File 0%</div>' : '';
  const dlDisabledAttr = sending ? ' disabled' : '';
  return '<div class="' + cls + '" id="imggrid-' + id + '">' + tiles + '</div>' +
    statusHtml +
    '<div class="img-dl-row"><button class="img-dl-btn" id="imgdl-' + id + '" title="Download"' + dlDisabledAttr + '>⬇️</button></div>';
}

function wireImageGrid(id, entries){
  const grid = document.getElementById('imggrid-' + id);
  if(grid){
    grid.querySelectorAll('.img-tile').forEach((tile) => {
      const idx = parseInt(tile.dataset.idx, 10);
      tile.addEventListener('click', () => {
        openImagePreview(entries, idx);
      });
    });
  }
  const dlBtn = document.getElementById('imgdl-' + id);
  if(dlBtn){
    dlBtn.onclick = () => downloadAllImages(entries);
  }
}

function downloadAllImages(entries){
  entries.forEach((e, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = e.url; a.download = e.name;
      document.body.appendChild(a); a.click(); a.remove();
    }, i * 350);
  });
}

function finalizeImageGroupOutgoing(rowId){
  const statusEl = document.getElementById('imgstatus-' + rowId);
  if(statusEl) statusEl.style.display = 'none';
  const dlBtn = document.getElementById('imgdl-' + rowId);
  if(dlBtn) dlBtn.removeAttribute('disabled');
}

function renderImageGroupOutgoing(id, files, replyTo){
  const row = document.createElement('div');
  row.className = 'msg-row me';
  row.id = 'msgrow-' + id;
  const entries = files.map(f => ({ url: URL.createObjectURL(f), name: f.name, size: f.size }));
  row.innerHTML = '<div class="bubble">' + renderReplyQuoteHtml(replyTo) +
    buildImageGridMarkup(id, entries, true) +
    '<div class="time">' + nowTime() + '</div>' +
  '</div>';
  messagesEl.appendChild(row);
  wireImageGrid(id, entries);
  messageMeta[id] = { type: 'imagegroup', mine: true, sender: myId, count: files.length, name: files[0].name };
  attachLongPress(row.querySelector('.bubble'), id);
  scrollToBottom();
}

async function uploadImageGroupChunks(files, groupIds, rowId){
  const totalBytes = files.reduce((a, f) => a + f.size, 0) || 1;
  let sentBytes = 0;
  const chunkCounts = [];
  for(let fi=0; fi<files.length; fi++){
    const file = files[fi];
    const groupId = groupIds[fi];
    const total = file.size;
    const chunkCount = Math.max(1, Math.ceil(total / CHUNK_RAW_SIZE));
    for(let i=0;i<chunkCount;i++){
      const start = i * CHUNK_RAW_SIZE;
      const end = Math.min(total, start + CHUNK_RAW_SIZE);
      const slice = file.slice(start, end);
      const buf = await slice.arrayBuffer();
      const b64 = abToBase64(buf);
      await db.ref('rooms/' + roomCode + '/fileChunks/' + groupId + '/' + i).set(b64);
      sentBytes += (end - start);
      const pct = Math.round((sentBytes / totalBytes) * 100);
      const statusEl = document.getElementById('imgstatus-' + rowId);
      if(statusEl) statusEl.textContent = 'Sending File ' + pct + '%';
    }
    chunkCounts.push(chunkCount);
  }
  return chunkCounts;
}

function sendImageGroup(files){
  if(!messagesRef){ addSysMessage('Room join nahi hai'); return; }
  const valid = [];
  for(const f of files){
    if(f.size > MAX_FILE_MB * 1024 * 1024){
      addSysMessage('"' + f.name + '" bahut badi hai (max ' + MAX_FILE_MB + 'MB)');
      continue;
    }
    valid.push(f);
  }
  if(!valid.length) return;

  const msgRef = messagesRef.push();
  const msgId = msgRef.key;
  seenMessageIds.add(msgId);
  const replyPayload = replyingTo ? { id: replyingTo.id, sender: replyingTo.sender, preview: replyingTo.preview } : null;
  if(replyingTo){ replyingTo = null; actionBarEl.style.display = 'none'; }

  renderImageGroupOutgoing(msgId, valid, replyPayload);
  const groupIds = valid.map(() => db.ref('rooms/' + roomCode + '/fileChunks').push().key);
  if(messageMeta[msgId]) messageMeta[msgId].groupIds = groupIds;

  uploadImageGroupChunks(valid, groupIds, msgId).then((chunkCounts) => {
    const images = valid.map((f, i) => ({
      name: f.name, size: f.size, mime: f.type, groupId: groupIds[i], chunkCount: chunkCounts[i]
    }));
    const payload = { type: 'imagegroup', sender: myId, time: nowTime(), images };
    if(replyPayload) payload.replyTo = replyPayload;
    return msgRef.set(payload);
  }).then(() => {
    dlog('Image group upload complete: ' + valid.length + ' image(s)');
    finalizeImageGroupOutgoing(msgId);
  }).catch((err) => {
    dlog('ERROR uploading image group: ' + err.message);
    addSysMessage('Image bhejne mein error: ' + err.message);
  });
}

function addImageGroupBubble(id, msg){
  const row = document.createElement('div');
  row.className = 'msg-row them';
  row.id = 'msgrow-' + id;
  row.innerHTML = '<div class="bubble">' + renderReplyQuoteHtml(msg.replyTo) +
    '<div class="img-status" id="imgstatus-' + id + '">Photos load ho rahi hain...</div>' +
    '<div class="time">' + (msg.time || nowTime()) + '</div>' +
  '</div>';
  messagesEl.appendChild(row);
  messageMeta[id] = {
    type: 'imagegroup', mine: false, sender: msg.sender,
    count: msg.images.length, name: msg.images[0].name,
    groupIds: msg.images.map(im => im.groupId)
  };
  attachLongPress(row.querySelector('.bubble'), id);
  scrollToBottom();

  Promise.all(msg.images.map((imgSpec) =>
    db.ref('rooms/' + roomCode + '/fileChunks/' + imgSpec.groupId).once('value').then((snap) => {
      const val = snap.val() || {};
      const parts = [];
      for(let i=0;i<imgSpec.chunkCount;i++){
        const b64 = val[i];
        if(!b64){ dlog('Missing chunk ' + i + ' for ' + imgSpec.name); continue; }
        parts.push(base64ToBytes(b64));
      }
      const blob = new Blob(parts, { type: imgSpec.mime });
      return { url: URL.createObjectURL(blob), name: imgSpec.name, size: imgSpec.size };
    })
  )).then((entries) => {
    const r = document.getElementById('msgrow-' + id);
    if(!r) return;
    const bubble = r.querySelector('.bubble');
    const statusEl = document.getElementById('imgstatus-' + id);
    if(statusEl) statusEl.remove();
    const timeEl = bubble.querySelector('.time');
    const gridHtml = buildImageGridMarkup(id, entries, false);
    if(timeEl) timeEl.insertAdjacentHTML('beforebegin', gridHtml);
    else bubble.insertAdjacentHTML('beforeend', gridHtml);
    wireImageGrid(id, entries);
  }).catch((err) => {
    dlog('ERROR fetching image group chunks: ' + err.message);
  });
}

function renderOutgoingFileRow(id, file, isImage, groupId, replyTo){
  const row = document.createElement('div');
  row.className = 'msg-row me';
  row.id = 'msgrow-' + id;
  const name = file.name, size = file.size;
  row.innerHTML = '<div class="bubble">' + renderReplyQuoteHtml(replyTo) +
    '<div class="file-card' + (isImage ? ' is-image' : '') + '">' +
      '<div class="fc-icon">' + (isImage ? '\u{1F5BC}\uFE0F' : '\u{1F4C4}') + '</div>' +
      '<div class="fc-info">' +
        '<div class="fc-name">' + escapeHtml(name) + '</div>' +
        '<div class="fc-size">' + fmtSize(size) + ' - bhej rahe hain...</div>' +
        '<div class="fc-progress-row">' +
          '<div class="fc-progress"><div class="fc-progress-fill" id="sprog-' + id + '"></div></div>' +
          '<div class="fc-pct" id="spct-' + id + '">0%</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="time">' + nowTime() + '</div>' +
  '</div>';
  messagesEl.appendChild(row);
  if(isImage){
    const localUrl = URL.createObjectURL(file);
    const img = document.createElement('img');
    img.src = localUrl;
    img.onclick = () => openImagePreview([{ url: localUrl, name, size }], 0);
    const card = row.querySelector('.file-card');
    row.querySelector('.bubble').insertBefore(img, card);
  }
  messageMeta[id] = { type: 'file', mine: true, sender: myId, name, groupId };
  attachLongPress(row.querySelector('.bubble'), id);
  scrollToBottom();
}

async function uploadFileChunks(file, groupId, rowId){
  const total = file.size;
  const chunkCount = Math.max(1, Math.ceil(total / CHUNK_RAW_SIZE));
  for(let i=0;i<chunkCount;i++){
    const start = i * CHUNK_RAW_SIZE;
    const end = Math.min(total, start + CHUNK_RAW_SIZE);
    const slice = file.slice(start, end);
    const buf = await slice.arrayBuffer();
    const b64 = abToBase64(buf);
    await db.ref('rooms/' + roomCode + '/fileChunks/' + groupId + '/' + i).set(b64);
    const pct = Math.round(((i+1)/chunkCount)*100);
    const bar = document.getElementById('sprog-' + rowId);
    const pctEl = document.getElementById('spct-' + rowId);
    if(bar) bar.style.width = pct + '%';
    if(pctEl) pctEl.textContent = pct + '%';
  }
  const sizeEl = document.querySelector('#msgrow-' + rowId + ' .fc-size');
  if(sizeEl) sizeEl.textContent = fmtSize(total) + ' - bheja gaya';
  return chunkCount;
}

function sendFile(file){
  if(!messagesRef){ addSysMessage('Room join nahi hai'); return; }
  if(file.type && file.type.startsWith('image/')){
    sendImageGroup([file]);
    return;
  }
  if(file.size > MAX_FILE_MB * 1024 * 1024){
    addSysMessage('"' + file.name + '" bahut badi hai (max ' + MAX_FILE_MB + 'MB)');
    return;
  }
  const isImage = false;
  const groupId = db.ref('rooms/' + roomCode + '/fileChunks').push().key;
  const msgRef = messagesRef.push();
  const msgId = msgRef.key;
  seenMessageIds.add(msgId);
  const replyPayload = replyingTo ? { id: replyingTo.id, sender: replyingTo.sender, preview: replyingTo.preview } : null;
  if(replyingTo){ replyingTo = null; actionBarEl.style.display = 'none'; }

  renderOutgoingFileRow(msgId, file, isImage, groupId, replyPayload);

  uploadFileChunks(file, groupId, msgId).then((chunkCount) => {
    const payload = {
      type:'file', sender: myId, name:file.name, size:file.size,
      mime:file.type, isImage, groupId, chunkCount, time: nowTime()
    };
    if(replyPayload) payload.replyTo = replyPayload;
    return msgRef.set(payload);
  }).then(() => {
    dlog('File upload complete: ' + file.name);
  }).catch((err) => {
    dlog('ERROR uploading file: ' + err.message);
    addSysMessage('File bhejne mein error: ' + err.message);
  });
}

function addFileBubble(id, msg){
  const row = document.createElement('div');
  row.className = 'msg-row them';
  row.id = 'msgrow-' + id;
  row.innerHTML = '<div class="bubble">' + renderReplyQuoteHtml(msg.replyTo) +
    '<div class="file-card' + (msg.isImage ? ' is-image' : '') + '">' +
      '<div class="fc-icon">' + (msg.isImage ? '\u{1F5BC}\uFE0F' : '\u{1F4C4}') + '</div>' +
      '<div class="fc-info">' +
        '<div class="fc-name">' + escapeHtml(msg.name) + '</div>' +
        '<div class="fc-size">' + fmtSize(msg.size) + ' - receive ho raha hai...</div>' +
      '</div>' +
    '</div>' +
    '<div class="time">' + (msg.time || nowTime()) + '</div>' +
  '</div>';
  messagesEl.appendChild(row);
  messageMeta[id] = { type: 'file', mine: false, sender: msg.sender, name: msg.name, groupId: msg.groupId };
  attachLongPress(row.querySelector('.bubble'), id);
  scrollToBottom();

  db.ref('rooms/' + roomCode + '/fileChunks/' + msg.groupId).once('value').then((snap) => {
    const val = snap.val() || {};
    const parts = [];
    for(let i=0;i<msg.chunkCount;i++){
      const b64 = val[i];
      if(!b64){ dlog('Missing chunk ' + i + ' for ' + msg.name); continue; }
      parts.push(base64ToBytes(b64));
    }
    const blob = new Blob(parts, { type: msg.mime });
    const url = URL.createObjectURL(blob);
    const r = document.getElementById('msgrow-' + id);
    if(!r) return;
    const card = r.querySelector('.file-card');
    const sizeEl = r.querySelector('.fc-size');
    sizeEl.textContent = fmtSize(msg.size);
    if(msg.isImage){
      const img = document.createElement('img');
      img.src = url;
      img.onclick = () => openImagePreview([{ url, name: msg.name, size: msg.size }], 0);
      r.querySelector('.bubble').insertBefore(img, card);
    }
    const dlBtn = document.createElement('button');
    dlBtn.className = 'fc-dl';
    dlBtn.textContent = 'Save';
    dlBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = url; a.download = msg.name;
      document.body.appendChild(a); a.click(); a.remove();
    };
    card.appendChild(dlBtn);
  }).catch((err) => {
    dlog('ERROR fetching file chunks: ' + err.message);
  });
}
